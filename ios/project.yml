name: MewtPhotos
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  MewtPhotosCore:
    path: Packages/MewtPhotosCore
targets:
  MewtPhotos:
    type: application
    platform: iOS
    sources:
      - path: MewtPhotos
        excludes:
          - Info.plist
    dependencies:
      - package: MewtPhotosCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mewtcor.mewtphotos
        PRODUCT_NAME: MewtPhotos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: MewtPhotos/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GIT_SHA: "dev"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
